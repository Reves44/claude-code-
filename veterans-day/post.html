<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Oswald:wght@400;600;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1630;--deep:#050b1a;--gold:#d4a73a;--gold2:#f3d27a;--blue:#1f4fa3;--red:#b3202a;}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:var(--deep);overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.post{position:relative;width:1080px;height:1350px;
 background:
  radial-gradient(ellipse 900px 600px at 50% 32%, rgba(31,79,163,.55), transparent 70%),
  radial-gradient(ellipse 700px 500px at 50% 110%, rgba(179,32,42,.35), transparent 70%),
  linear-gradient(180deg,#0b1630 0%,#050b1a 100%);}
.stars{position:absolute;inset:0;opacity:.55}
.stripes{position:absolute;left:0;right:0;bottom:0;height:300px;opacity:.10;
 background:repeating-linear-gradient(180deg,#fff 0 22px,transparent 22px 44px);
 -webkit-mask-image:linear-gradient(0deg,#000,transparent);mask-image:linear-gradient(0deg,#000,transparent)}
.frame{position:absolute;inset:28px;border:2px solid rgba(212,167,58,.55);}
.frame:after{content:"";position:absolute;inset:8px;border:1px solid rgba(212,167,58,.25)}
.top{position:absolute;top:62px;left:0;right:0;text-align:center}
.greek{font-family:Cinzel,serif;font-weight:900;font-size:112px;line-height:1;letter-spacing:10px;
 background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#9a7420);-webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 6px 18px rgba(212,167,58,.35))}
.name{margin-top:10px;font-family:Cinzel,serif;font-weight:800;font-size:40px;letter-spacing:22px;padding-left:22px;color:#fff}
.rule{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:22px;color:var(--gold);font-family:Oswald;font-size:20px;letter-spacing:6px}
.rule i{display:block;width:150px;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule i:last-child{transform:scaleX(-1)}
.hero{position:absolute;top:340px;left:0;right:0;text-align:center}
.hero h1{font-family:Oswald;font-weight:700;font-size:168px;line-height:.9;letter-spacing:4px;text-transform:uppercase;
 text-shadow:0 8px 40px rgba(0,0,0,.6)}
.hero h1 span{display:block;font-size:118px;letter-spacing:38px;padding-left:38px;color:var(--gold2)}
.hero p{margin-top:20px;font-family:Oswald;font-size:30px;letter-spacing:8px;text-transform:uppercase;color:#cfd8ee}
.grid{position:absolute;top:740px;left:72px;right:72px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
 border:1px solid rgba(212,167,58,.35);border-radius:6px;padding:20px 14px 18px;text-align:center;overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--c)}
.card svg{width:44px;height:44px;margin-bottom:8px}
.card h3{font-family:Oswald;font-weight:600;font-size:28px;letter-spacing:3px;text-transform:uppercase}
.card .m{font-family:Cinzel,serif;font-weight:600;font-size:16px;color:var(--gold2);margin-top:6px;letter-spacing:1px}
.card .y{font-family:Oswald;font-size:14px;letter-spacing:4px;color:#8f9bbb;margin-top:6px}
.foot{position:absolute;bottom:78px;left:0;right:0;text-align:center}
.foot .t{font-family:Cinzel,serif;font-weight:800;font-size:44px;letter-spacing:4px}
.foot .s{margin-top:10px;font-family:Oswald;font-size:20px;letter-spacing:7px;color:var(--gold);text-transform:uppercase}
</style></head>
<body><div class="post">
<svg class="stars" viewBox="0 0 1080 1350" id="stars"></svg>
<div class="stripes"></div>
<div class="frame"></div>

<div class="top">
  <div class="greek">ΣΧ</div>
  <div class="name">SIGMA CHI</div>
  <div class="rule"><i></i>★ HONORS ★<i></i></div>
</div>

<div class="hero">
  <h1>Veterans<span>Day</span></h1>
  <p>November 11 &nbsp;·&nbsp; 2026</p>
</div>

<div class="grid" id="grid"></div>

<div class="foot">
  <div class="t">Thank You For Your Service</div>
  <div class="s">To every brother &amp; every hero who served</div>
</div>
</div>
<script>
// starfield
const s=document.getElementById('stars');let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<140;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
 c.setAttribute('cx',r()*1080);c.setAttribute('cy',r()*780);c.setAttribute('r',r()*1.6+.3);
 c.setAttribute('fill','#fff');c.setAttribute('opacity',r()*.8+.2);s.appendChild(c);}
const star='<path d="M24 3l6.2 13.6 14.8 1.6-11 10 3.1 14.6L24 35.4 10.9 42.8 14 28.2 3 18.2l14.8-1.6z" fill="currentColor"/>';
const icons={
 star:star,
 anchor:'<g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><circle cx="24" cy="9" r="4.5"/><path d="M24 13.5V44M14 22h20M7 30c2 8 9 14 17 14s15-6 17-14"/><path d="M4 33l3-4 4 3M44 33l-3-4-4 3"/></g>',
 globe:'<g fill="none" stroke="currentColor" stroke-width="3.2"><circle cx="24" cy="24" r="19"/><ellipse cx="24" cy="24" rx="8" ry="19"/><path d="M5 24h38M8 14h32M8 34h32"/></g>',
 wings:'<g fill="currentColor"><path d="M24 6l6 18-6 6-6-6z"/><path d="M19 18L0 12l5 7-3 1 7 4-2 2 9 1 4-3zM29 18l19-6-5 7 3 1-7 4 2 2-9 1-4-3z"/><path d="M24 32l3 10h-6z"/></g>',
 delta:'<g fill="currentColor"><path d="M24 2l12 40-12-8-12 8z"/></g><circle cx="24" cy="26" r="17" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".6"/>',
 life:'<g fill="none" stroke="currentColor" stroke-width="3.5"><circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="8"/></g><g stroke="currentColor" stroke-width="6"><path d="M24 7v9M24 32v9M7 24h9M32 24h9"/></g>'
};
const B=[
 ['Army','This We\'ll Defend','Est. 1775','#4b5320','star'],
 ['Navy','Non Sibi Sed Patriae','Est. 1775','#1b3d8f','anchor'],
 ['Marine Corps','Semper Fidelis','Est. 1775','#a6192e','globe'],
 ['Air Force','Aim High','Est. 1947','#5b8fd6','wings'],
 ['Space Force','Semper Supra','Est. 2019','#9aa3b5','delta'],
 ['Coast Guard','Semper Paratus','Est. 1790','#e8692c','life'],
];
document.getElementById('grid').innerHTML=B.map(([n,m,y,c,i])=>`<div class="card" style="--c:${c}">
 <svg viewBox="0 0 48 48" style="color:#f3d27a">${icons[i]}</svg><h3>${n}</h3><div class="m">${m}</div><div class="y">${y}</div></div>`).join('');
</script>
</body></html>
