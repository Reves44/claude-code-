<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0b0b0d;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.14),transparent 60%)}
.top{position:absolute;top:60px;width:100%;text-align:center;letter-spacing:14px;font-weight:800;font-size:30px;color:#cfd3da}
.top .greek{display:block;font-family:Anton,Impact,sans-serif;font-size:84px;letter-spacing:10px;color:#fff;margin-bottom:6px}
.shirts{position:absolute;top:250px;width:100%;display:flex;justify-content:center;gap:24px}
.shirt{position:relative;width:300px;height:300px}
.shirt svg{width:100%;height:100%;filter:drop-shadow(0 12px 24px rgba(0,0,0,.6))}
.shirt span{position:absolute;top:118px;left:60px;right:60px;text-align:center;font-family:'Permanent Marker',cursive;color:#111;font-size:30px;line-height:1.05}
.s1{transform:rotate(-8deg) translateY(30px)}.s3{transform:rotate(8deg) translateY(30px)}
.s1 span{color:#c0142a}.s3 span{color:#0a3d91}
.title{position:absolute;top:600px;width:100%;text-align:center;font-family:Anton,Impact,sans-serif;font-size:250px;line-height:.9;letter-spacing:4px}
.title .lies{display:block;font-family:'Permanent Marker',cursive;font-size:190px;color:#fff;transform:rotate(-4deg);margin-top:-10px;text-shadow:0 0 30px rgba(255,255,255,.25)}
.rule{position:absolute;top:1035px;left:50%;transform:translateX(-50%);font-size:32px;font-weight:500;color:#d7dae0;text-align:center;width:900px}
.rule b{color:#fff}
.date{position:absolute;top:1100px;left:70px;right:70px;border:3px solid #fff;padding:22px 0;text-align:center;font-family:Anton,Impact,sans-serif;font-size:54px;letter-spacing:3px;white-space:nowrap}
.invite{position:absolute;bottom:52px;width:100%;text-align:center;font-weight:800;font-size:28px;letter-spacing:6px;color:#cfd3da}
.invite em{font-style:normal;color:#fff;border-bottom:3px solid #fff}
</style></head><body>
<div class="glow"></div>
<div class="top"><span class="greek">ΣΧ</span>SIGMA CHI PRESENTS</div>
<div class="shirts">
 <div class="shirt s1"><svg viewBox="0 0 300 300"><path d="M95 30 L60 40 L5 85 L40 140 L70 120 L70 285 L230 285 L230 120 L260 140 L295 85 L240 40 L205 30 Q150 70 95 30Z" fill="#f4f4f2"/></svg><span>I'm the DD tonight</span></div>
 <div class="shirt s2"><svg viewBox="0 0 300 300"><path d="M95 30 L60 40 L5 85 L40 140 L70 120 L70 285 L230 285 L230 120 L260 140 L295 85 L240 40 L205 30 Q150 70 95 30Z" fill="#f4f4f2"/></svg><span>I've read the syllabus</span></div>
 <div class="shirt s3"><svg viewBox="0 0 300 300"><path d="M95 30 L60 40 L5 85 L40 140 L70 120 L70 285 L230 285 L230 120 L260 140 L295 85 L240 40 L205 30 Q150 70 95 30Z" fill="#f4f4f2"/></svg><span>I'll text you back</span></div>
</div>
<div class="title">WHITE<span class="lies">Lies</span></div>
<div class="rule">Wear a <b>white shirt</b>. Write a <b>lie</b> on it.</div>
<div class="date">SATURDAY 11/14 · 8:00 – 11:00 PM</div>
<div class="invite">INVITE ONLY — <em>REACH OUT TO A BROTHER</em></div>
</body></html>
