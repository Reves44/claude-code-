<style>

const q=new URLSearchParams(location.search), sw=q.get('bg');
if(sw){const el=document.querySelector('.s2 .photo, .s3 .cover, .s4 .cover, .s5 .cover, .s6 .cover, .s7 .pol div');
 if(el){el.style.backgroundImage='url('+sw+')'; if(q.get('pos')) el.style.backgroundPosition=q.get('pos');}}
</script></body></html>
