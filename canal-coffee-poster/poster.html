<!doctype html>
<html><head><meta charset="utf-8"><title>Canal Coffee Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pacifico&family=Dancing+Script:wght@600;700&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1d3461;--gold:#e0a63a;--brown:#6b4226;--tan:#e8cfae;--cream:#fbf5ec}
  html,body{margin:0;background:var(--cream)}
  .poster{width:1200px;height:1800px;position:relative;overflow:hidden;background:#f7eee2;color:var(--ink);text-align:center}
  .deco{position:absolute;inset:0;pointer-events:none}
  .content{position:relative;padding-top:70px}
  .sigma{font-family:'Great Vibes',cursive;font-size:210px;line-height:1}
  .presents{font-family:'Dancing Script',cursive;font-weight:700;font-size:50px;color:var(--brown);margin-top:-6px}
  .hero{position:relative;width:1200px;height:560px;margin-top:10px}
  .hero .mug{position:absolute;left:340px;top:70px;width:520px}
  .sticker{position:absolute;left:780px;top:40px;width:250px;height:250px;border-radius:50%;background:var(--gold);
    transform:rotate(12deg);display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 0 0 10px #f7eee2;color:#fff}
  .sticker::before{content:"";position:absolute;inset:14px;border:3px dashed rgba(255,255,255,.75);border-radius:50%}
  .sticker b{font-family:'Pacifico',cursive;font-weight:400;font-size:88px;line-height:1}
  .sticker i{font-family:'Dancing Script',cursive;font-style:normal;font-weight:700;font-size:38px;margin-top:-4px}
  .brand{font-family:'Pacifico',cursive;font-size:140px;line-height:1.1;margin-top:-10px}
  .tag{font-family:'Dancing Script',cursive;font-weight:700;font-size:56px;line-height:1.2;margin-top:18px;color:var(--brown)}
  .find{font-family:'Dancing Script',cursive;font-weight:700;font-size:50px;color:var(--brown);margin-top:44px}
  .pill{display:inline-flex;align-items:center;gap:26px;background:var(--ink);color:var(--cream);border-radius:999px;
    padding:22px 70px 30px 54px;margin-top:10px;font-family:'Kaushan Script',cursive;font-size:96px;line-height:1}
  .pill svg{width:62px;height:82px;margin-top:10px}
  .huntsman{position:absolute;left:0;right:0;bottom:140px;display:flex;align-items:center;justify-content:center;gap:22px}
  .huntsman svg{width:54px;height:84px}
  .huntsman div{font-family:'Dancing Script',cursive;font-weight:700;font-size:52px;line-height:1.1;text-align:left}
  .huntsman small{display:block;font-size:36px;color:var(--brown)}
</style></head>
<body><div class="poster">
  <svg class="deco" width="1200" height="1800" aria-hidden="true">
    <defs>
      <g id="bean"><ellipse rx="22" ry="32" fill="#6b4226"/><path d="M0-30C-12-10 12 10 0 30" stroke="#f7eee2" stroke-width="4" fill="none" stroke-linecap="round"/></g>
      <path id="spark" d="M0-26C3-6 6-3 26 0 6 3 3 6 0 26-3 6-6 3-26 0-6-3-3-6 0-26z"/>
    </defs>
    <!-- corner blobs -->
    <path d="M-80 -60C120-80 300 20 260 160 220 300 60 300-40 380-120 440-160 200-80-60z" fill="#e8cfae"/>
    <path d="M1300 1380C1180 1360 1040 1440 1060 1580 1080 1720 960 1780 1000 1900L1300 1900z" fill="#e8cfae"/>
    <path d="M1260 120C1150 90 1080 170 1120 250 1160 330 1240 300 1270 360z" fill="#cfdcef"/>
    <path d="M-60 1500C40 1470 120 1550 90 1640 60 1730-20 1760-60 1820z" fill="#cfdcef"/>
    <!-- hero blob behind mug -->
    <path transform="translate(0 -25)" d="M600 480C760 470 900 520 910 640 920 760 860 880 720 900 600 918 560 880 450 890 330 900 270 820 280 700 290 560 450 486 600 480z" fill="#1d3461"/>
    <!-- dotted arc -->
    <path d="M250 560C240 430 330 400 360 420" fill="none" stroke="#6b4226" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round"/>
    <!-- beans -->
    <use href="#bean" transform="translate(150 720) rotate(-30)"/>
    <use href="#bean" transform="translate(210 820) rotate(20) scale(.8)"/>
    <use href="#bean" transform="translate(1040 820) rotate(40)"/>
    <use href="#bean" transform="translate(1080 1230) rotate(-15) scale(.75)"/>
    <use href="#bean" transform="translate(120 1250) rotate(60) scale(.7)"/>
    <!-- sparkles -->
    <use href="#spark" fill="#e0a63a" transform="translate(180 470)"/>
    <use href="#spark" fill="#e0a63a" transform="translate(1060 660) scale(.7)"/>
    <use href="#spark" fill="#1d3461" transform="translate(110 1020) scale(.55)"/>
    <use href="#spark" fill="#e0a63a" transform="translate(1100 1060) scale(.5)"/>
    <use href="#spark" fill="#1d3461" transform="translate(1000 300) scale(.5)"/>
  </svg>

  <div class="content">
    <div class="sigma">Sigma Chi</div>
    <div class="presents">presents</div>

    <div class="hero">
      <svg class="mug" viewBox="0 0 440 340" aria-hidden="true">
        <defs>
          <linearGradient id="body" x1="0" x2="1">
            <stop offset="0" stop-color="#cfc6b6"/><stop offset=".18" stop-color="#f4f0e8"/><stop offset=".38" stop-color="#ffffff"/>
            <stop offset=".7" stop-color="#e9e3d7"/><stop offset="1" stop-color="#b7ad9c"/>
          </linearGradient>
          <linearGradient id="handle" x1="0" x2="1"><stop offset="0" stop-color="#e8e1d4"/><stop offset=".5" stop-color="#fbf8f2"/><stop offset="1" stop-color="#b9af9e"/></linearGradient>
          <radialGradient id="coffee" cx=".45" cy=".45" r=".6">
            <stop offset="0" stop-color="#c9925a"/><stop offset=".45" stop-color="#9a6234"/><stop offset=".8" stop-color="#5a331a"/><stop offset="1" stop-color="#2f1a0d"/>
          </radialGradient>
          <radialGradient id="saucer" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#fbf8f2"/><stop offset=".7" stop-color="#e6dfd1"/><stop offset="1" stop-color="#b8ae9c"/></radialGradient>
          <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
          <filter id="steamblur"><feGaussianBlur stdDeviation="3.5"/></filter>
        </defs>
        <ellipse cx="225" cy="305" rx="190" ry="26" fill="#000" opacity=".35" filter="url(#soft)"/>
        <ellipse cx="220" cy="290" rx="190" ry="40" fill="#a89e8b"/>
        <ellipse cx="220" cy="284" rx="188" ry="38" fill="url(#saucer)"/>
        <ellipse cx="220" cy="282" rx="120" ry="22" fill="#d9d1c2"/>
        <ellipse cx="225" cy="282" rx="112" ry="18" fill="#7d6f5a" opacity=".45" filter="url(#soft)"/>
        <path d="M318 120c62-10 84 30 74 70-9 38-46 58-82 62l-2-26c24-4 50-18 56-42 6-26-8-44-44-38z" fill="url(#handle)" stroke="#a69c8a" stroke-width="1.5"/>
        <path d="M110 92h220l-10 168c-1 16-14 26-30 26H150c-16 0-29-10-30-26z" fill="url(#body)"/>
        <path d="M120 260c1 16 14 26 30 26h140c16 0 29-10 30-26" fill="none" stroke="#a69c8a" stroke-width="1.5"/>
        <path d="M150 112c-6 50-4 110 4 160" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".7" filter="url(#steamblur)"/>
        <ellipse cx="220" cy="92" rx="110" ry="24" fill="#f7f3ec" stroke="#b3a996" stroke-width="1.5"/>
        <ellipse cx="220" cy="94" rx="100" ry="19" fill="url(#coffee)"/>
        <path d="M168 96c14-12 44-14 62-6 16 8 4 18-14 16-18-2-22-10-8-14" fill="none" stroke="#e2b98a" stroke-width="3" opacity=".7" stroke-linecap="round"/>
        <ellipse cx="220" cy="94" rx="100" ry="19" fill="none" stroke="#3a2212" stroke-width="2" opacity=".6"/>
        <g fill="none" stroke="#fff" stroke-linecap="round" filter="url(#steamblur)" opacity=".85">
          <path d="M196 70c-18-22 16-34 0-58" stroke-width="9"/>
          <path d="M232 66c-16-20 18-30 4-56" stroke-width="7" opacity=".7"/>
          <path d="M262 74c-12-16 12-24 2-42" stroke-width="6" opacity=".55"/>
        </g>
      </svg>
      <div class="sticker"><b>Free</b><i>for everyone!</i></div>
    </div>

    <div class="brand">Canal Coffee</div>
    <div class="tag">Come on out &amp; grab a warm cup on us ~<br>the best way to start your day</div>
    <div class="find">find us on the</div>
    <div class="pill">
      <svg viewBox="0 0 30 40" aria-hidden="true"><path d="M15 1C7 1 1 7 1 15c0 10 14 24 14 24s14-14 14-24C29 7 23 1 15 1z" fill="#e0a63a"/><circle cx="15" cy="15" r="5.5" fill="#1d3461"/></svg>
      Library Steps
    </div>
  </div>

  <div class="huntsman">
    <svg viewBox="0 0 40 62" aria-hidden="true"><path d="M20 30C8 18 10 4 20 4s12 14 0 26L6 58M20 30l14 28" fill="none" stroke="#e0a63a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><small>proudly supporting</small>Huntsman Cancer Institute</div>
  </div>
</div></body></html>
