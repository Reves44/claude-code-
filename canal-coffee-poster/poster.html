<!doctype html>
<html><head><meta charset="utf-8"><title>Canal Coffee Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pacifico&family=Dancing+Script:wght@600;700&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1d3461;--gold:#e0a63a;--brown:#6b4226;--cream:#fbf5ec}
  html,body{margin:0;background:var(--cream)}
  .poster{width:1200px;height:1800px;position:relative;overflow:hidden;background:#f7eee2;color:var(--ink)}
  .abs{position:absolute}
  .deco{left:0;top:0;pointer-events:none}
  .sigma{left:0;right:0;top:30px;text-align:center;font-family:'Great Vibes',cursive;font-size:180px;line-height:1}
  .presents{left:0;right:0;top:215px;text-align:center;font-family:'Dancing Script',cursive;font-weight:700;font-size:46px;color:var(--brown)}
  .mug{left:40px;top:330px;width:520px}
  .sticker{left:410px;top:285px;width:190px;height:190px;border-radius:50%;background:var(--gold);transform:rotate(-10deg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 9px #f7eee2;color:#fff}
  .sticker::before{content:"";position:absolute;inset:11px;border:3px dashed rgba(255,255,255,.75);border-radius:50%}
  .sticker b{font-family:'Pacifico',cursive;font-weight:400;font-size:66px;line-height:1}
  .sticker i{font-family:'Dancing Script',cursive;font-style:normal;font-weight:700;font-size:30px}
  .headline{left:600px;top:320px;width:560px;text-align:center}
  .headline .brand{font-family:'Pacifico',cursive;font-size:128px;line-height:1.05}
  .headline .tag{font-family:'Dancing Script',cursive;font-weight:700;font-size:46px;line-height:1.2;color:var(--brown);margin-top:18px}
  .where{left:0;right:0;top:770px;text-align:center}
  .where .find{font-family:'Dancing Script',cursive;font-weight:700;font-size:46px;color:var(--brown)}
  .pill{display:inline-flex;align-items:center;gap:24px;background:var(--ink);color:var(--cream);border-radius:999px;
    padding:16px 64px 24px 48px;margin-top:6px;font-family:'Kaushan Script',cursive;font-size:84px;line-height:1}
  .pill svg{width:52px;height:70px;margin-top:8px}
  .pol{background:#fff;padding:16px 16px 0;box-shadow:0 14px 28px rgba(40,25,10,.28),0 2px 4px rgba(40,25,10,.2)}
  .pol img{display:block}
  .pol p{margin:0;height:70px;line-height:70px;text-align:center;font-family:'Dancing Script',cursive;font-weight:700;font-size:40px;color:var(--ink)}
  .tape{position:absolute;width:150px;height:40px;background:rgba(224,166,58,.6);top:-20px;left:50%;margin-left:-75px}
  .p1{left:42px;top:1050px;transform:rotate(-7deg)} .p1 img{width:350px;height:280px}
  .p3{left:806px;top:1060px;transform:rotate(6deg)} .p3 img{width:350px;height:280px}
  .p2{left:337px;top:990px;transform:rotate(-1.5deg);z-index:2} .p2 img{width:494px;height:357px}
  .p2 .tape{transform:rotate(-3deg);background:rgba(207,220,239,.85)}
  .band{left:0;right:0;bottom:0;height:290px;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;gap:34px}
  .band::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--gold)}
  .band svg{width:92px;height:142px}
  .band .t{text-align:center}
  .band small{display:block;font-family:'Dancing Script',cursive;font-weight:700;font-size:54px;color:var(--gold);line-height:1}
  .band b{display:block;font-family:'Pacifico',cursive;font-weight:400;font-size:88px;line-height:1.25}
</style></head>
<body><div class="poster">
  <svg class="abs deco" width="1200" height="1800" aria-hidden="true">
    <defs>
      <g id="bean"><ellipse rx="22" ry="32" fill="#6b4226"/><path d="M0-30C-12-10 12 10 0 30" stroke="#f7eee2" stroke-width="4" fill="none" stroke-linecap="round"/></g>
      <path id="spark" d="M0-26C3-6 6-3 26 0 6 3 3 6 0 26-3 6-6 3-26 0-6-3-3-6 0-26z"/>
    </defs>
    <path d="M-80 -60C120-80 300 20 260 160 220 300 60 300-40 380-120 440-160 200-80-60z" fill="#e8cfae"/>
    <path d="M1260 60C1130 40 1060 150 1110 240 1160 330 1240 300 1270 360z" fill="#cfdcef"/>
    <path d="M1300 850C1200 840 1150 920 1180 990L1300 1000z" fill="#e8cfae"/>
    <path d="M-40 880C40 860 80 930 40 980L-40 1000z" fill="#cfdcef"/>
    <!-- blob behind mug -->
    <path d="M300 330C440 320 560 370 560 480 560 590 510 680 390 690 290 700 250 670 160 680 70 690 30 610 40 510 50 390 170 336 300 330z" fill="#1d3461"/>
    <use href="#bean" transform="translate(70 300) rotate(-30) scale(.8)"/>
    <use href="#bean" transform="translate(1150 560) rotate(-20) scale(.75)"/>
    <use href="#bean" transform="translate(80 880) rotate(50) scale(.7)"/>
    <use href="#spark" fill="#e0a63a" transform="translate(1100 300) scale(.8)"/>
    <use href="#spark" fill="#1d3461" transform="translate(150 860) scale(.55)"/>
    <use href="#spark" fill="#e0a63a" transform="translate(1060 860) scale(.6)"/>
    <use href="#spark" fill="#e0a63a" transform="translate(1140 1470) scale(.6)"/>
  </svg>

  <div class="abs sigma">Sigma Chi</div>
  <div class="abs presents">presents</div>

  <svg class="abs mug" viewBox="0 0 440 340" aria-hidden="true">
        <defs>
          <linearGradient id="body" x1="0" x2="1">
            <stop offset="0" stop-color="#cfc6b6"/><stop offset=".18" stop-color="#f4f0e8"/><stop offset=".38" stop-color="#ffffff"/>
            <stop offset=".7" stop-color="#e9e3d7"/><stop offset="1" stop-color="#b7ad9c"/>
          </linearGradient>
          <linearGradient id="handle" x1="0" x2="1"><stop offset="0" stop-color="#e8e1d4"/><stop offset=".5" stop-color="#fbf8f2"/><stop offset="1" stop-color="#b9af9e"/></linearGradient>
          <radialGradient id="coffee" cx=".45" cy=".45" r=".6">
            <stop offset="0" stop-color="#c9925a"/><stop offset=".45" stop-color="#9a6234"/><stop offset=".8" stop-color="#5a331a"/><stop offset="1" stop-color="#2f1a0d"/>
          </radialGradient>
          <radialGradient id="saucer" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#fbf8f2"/><stop offset=".7" stop-color="#e6dfd1"/><stop offset="1" stop-color="#b8ae9c"/></radialGradient>
          <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
          <filter id="steamblur"><feGaussianBlur stdDeviation="3.5"/></filter>
        </defs>
        <ellipse cx="225" cy="305" rx="190" ry="26" fill="#000" opacity=".35" filter="url(#soft)"/>
        <ellipse cx="220" cy="290" rx="190" ry="40" fill="#a89e8b"/>
        <ellipse cx="220" cy="284" rx="188" ry="38" fill="url(#saucer)"/>
        <ellipse cx="220" cy="282" rx="120" ry="22" fill="#d9d1c2"/>
        <ellipse cx="225" cy="282" rx="112" ry="18" fill="#7d6f5a" opacity=".45" filter="url(#soft)"/>
        <path d="M318 120c62-10 84 30 74 70-9 38-46 58-82 62l-2-26c24-4 50-18 56-42 6-26-8-44-44-38z" fill="url(#handle)" stroke="#a69c8a" stroke-width="1.5"/>
        <path d="M110 92h220l-10 168c-1 16-14 26-30 26H150c-16 0-29-10-30-26z" fill="url(#body)"/>
        <path d="M120 260c1 16 14 26 30 26h140c16 0 29-10 30-26" fill="none" stroke="#a69c8a" stroke-width="1.5"/>
        <path d="M150 112c-6 50-4 110 4 160" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".7" filter="url(#steamblur)"/>
        <ellipse cx="220" cy="92" rx="110" ry="24" fill="#f7f3ec" stroke="#b3a996" stroke-width="1.5"/>
        <ellipse cx="220" cy="94" rx="100" ry="19" fill="url(#coffee)"/>
        <path d="M168 96c14-12 44-14 62-6 16 8 4 18-14 16-18-2-22-10-8-14" fill="none" stroke="#e2b98a" stroke-width="3" opacity=".7" stroke-linecap="round"/>
        <ellipse cx="220" cy="94" rx="100" ry="19" fill="none" stroke="#3a2212" stroke-width="2" opacity=".6"/>
        <g fill="none" stroke="#fff" stroke-linecap="round" filter="url(#steamblur)" opacity=".85">
          <path d="M196 70c-18-22 16-34 0-58" stroke-width="9"/>
          <path d="M232 66c-16-20 18-30 4-56" stroke-width="7" opacity=".7"/>
          <path d="M262 74c-12-16 12-24 2-42" stroke-width="6" opacity=".55"/>
        </g>
      </svg>
  <div class="abs sticker"><b>Free</b><i>for everyone!</i></div>

  <div class="abs headline">
    <div class="brand">Canal<br>Coffee</div>
    <div class="tag">Come on out &amp;<br>grab a warm cup on us!</div>
  </div>

  <div class="abs where">
    <div class="find">find us on the</div>
    <div class="pill"><svg viewBox="0 0 30 40" aria-hidden="true"><path d="M15 1C7 1 1 7 1 15c0 10 14 24 14 24s14-14 14-24C29 7 23 1 15 1z" fill="#e0a63a"/><circle cx="15" cy="15" r="5.5" fill="#1d3461"/></svg>Library Steps</div>
  </div>

  <div class="abs pol p1"><span class="tape" style="transform:rotate(4deg)"></span><img src="photos/sign-crop.jpg" alt=""><p style="text-align:left;padding-left:14px">Our cause ♡</p></div>
  <div class="abs pol p3"><span class="tape" style="transform:rotate(-5deg)"></span><img src="photos/award-crop.jpg" alt=""><p>20K Club</p></div>
  <div class="abs pol p2"><span class="tape"></span><img src="photos/booth-crop.jpg" alt=""><p>Who are you fighting for?</p></div>

  <div class="abs band">
    <svg viewBox="0 0 40 62" aria-hidden="true"><path d="M20 30C8 18 10 4 20 4s12 14 0 26L6 58M20 30l14 28" fill="none" stroke="#e0a63a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="t"><small>proudly supporting</small><b>Huntsman Cancer Institute</b></div>
  </div>
</div></body></html>
