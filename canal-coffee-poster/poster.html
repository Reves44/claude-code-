<!doctype html>
<html><head><meta charset="utf-8"><title>Canal Coffee Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Bebas+Neue&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#0b1f3a}
  .poster{width:1200px;height:1800px;box-sizing:border-box;position:relative;overflow:hidden;
    background:radial-gradient(circle at 50% 38%,#1d4b86 0%,#0f2b52 45%,#081a33 100%);
    color:#fff;font-family:Montserrat,sans-serif;text-align:center;padding:70px 80px}
  .frame{position:absolute;inset:30px;border:6px solid #e8b931;border-radius:24px;pointer-events:none}
  .frame::after{content:"";position:absolute;inset:14px;border:2px solid rgba(232,185,49,.5);border-radius:14px}
  .sigma{font-family:'Great Vibes',cursive;font-size:220px;line-height:1;color:#f4c542;margin-top:30px;
    text-shadow:0 6px 0 rgba(0,0,0,.35)}
  .presents{letter-spacing:.5em;font-weight:700;font-size:28px;color:#cfe0ff;margin-top:10px}
  .cup{margin:40px auto 10px;width:360px;height:360px}
  .free{font-family:'Bebas Neue',sans-serif;font-size:300px;line-height:.85;color:#f4c542;margin-top:10px;
    text-shadow:0 8px 0 #7a5a00}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:150px;line-height:.9;letter-spacing:.04em}
  .tag{font-size:44px;font-weight:800;margin:40px auto 0;max-width:900px;line-height:1.25}
  .tag em{color:#f4c542;font-style:normal}
  .where{display:inline-block;margin-top:55px;background:#f4c542;color:#0b1f3a;border-radius:18px;
    padding:26px 60px;font-family:'Bebas Neue',sans-serif;font-size:96px;letter-spacing:.04em;line-height:1;
    box-shadow:0 10px 0 #7a5a00}
  .where small{display:block;font-family:Montserrat,sans-serif;font-weight:800;font-size:26px;letter-spacing:.35em;margin-bottom:10px}
  .foot{position:absolute;left:0;right:0;bottom:80px;font-size:28px;font-weight:700;letter-spacing:.3em;color:#cfe0ff}
</style></head>
<body><div class="poster"><div class="frame"></div>
  <div class="sigma">Sigma Chi</div>
  <div class="presents">PRESENTS</div>
  <svg class="cup" viewBox="0 0 200 200" aria-hidden="true">
    <g fill="none" stroke="#cfe0ff" stroke-width="6" stroke-linecap="round">
      <path d="M78 22c-10 12 10 20 0 34"/><path d="M100 14c-12 14 12 24 0 42"/><path d="M122 22c-10 12 10 20 0 34"/>
    </g>
    <path d="M40 70h120l-14 100a12 12 0 0 1-12 10H66a12 12 0 0 1-12-10z" fill="#fff"/>
    <rect x="34" y="62" width="132" height="16" rx="8" fill="#f4c542"/>
    <path d="M160 92h10a20 20 0 0 1 0 40h-14" fill="none" stroke="#fff" stroke-width="10"/>
    <rect x="50" y="102" width="100" height="50" fill="#0f2b52"/>
    <text x="100" y="125" text-anchor="middle" font-family="Bebas Neue" font-size="22" letter-spacing="1" fill="#f4c542">CANAL</text>
    <text x="100" y="146" text-anchor="middle" font-family="Bebas Neue" font-size="22" letter-spacing="1" fill="#f4c542">COFFEE</text>
  </svg>
  <div class="free">FREE</div>
  <div class="brand">CANAL COFFEE</div>
  <div class="tag">Swing by, grab a cup on us &amp; <em>fuel up</em> for the day! ☕</div>
  <div class="where"><small>FIND US AT THE</small>LIBRARY STEPS</div>
  <div class="foot">COME THIRSTY · LEAVE CAFFEINATED</div>
</div></body></html>
